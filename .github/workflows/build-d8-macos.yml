name: Build d8 V8-10.2.154.26 (macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Install dependencies
        run: |
          brew install python3 git curl pkg-config

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd depot_tools && ./ensure_bootstrap

      - name: Fetch V8
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout 10.2.154.26
          gclient sync --nohooks --no-history

      - name: Patch source
        run: |
          cd build/v8
          python3 << 'PYEOF'
          import re

          # 1. BUILD.gn: remove Werror + clang plugins
          with open('build/config/compiler/BUILD.gn') as f:
              gn = f.read()
          gn = gn.replace('"-Werror"', '"-Wno-error"')
          gn = '\n'.join(l for l in gn.split('\n') 
              if not any(x in l for x in ['add-plugin','plugin-arg-find-bad',
                  'check-stack-allocated','raw-ptr-template','use-classify-type']))
          with open('build/config/compiler/BUILD.gn', 'w') as f:
              f.write(gn)

          # 2. instruction-codes.h: comment out static_asserts
          with open('src/compiler/backend/instruction-codes.h') as f:
              ic = f.read()
          ic = re.sub(r'^(static_assert\(ArchOpcodeField)', r'//\1', ic, flags=re.M)
          ic = re.sub(r'^(\s+AddressingModeField::is_valid)', r'//\1', ic, flags=re.M)
          ic = re.sub(r'^(\s+"All addressing modes)', r'//\1', ic, flags=re.M)
          with open('src/compiler/backend/instruction-codes.h', 'w') as f:
              f.write(ic)

          # 3. bit-field.h: fix constexpr kMax for Clang 21
          with open('src/base/bit-field.h') as f:
              bf = f.read()
          # Use the original line but wrap kMax init to avoid static_cast issue
          bf = bf.replace(
              'static constexpr T kMax = static_cast<T>(kNumValues - 1);',
              'static constexpr T kMax = T{} < T{-1} ? static_cast<T>(kNumValues - 1) : static_cast<T>(kNumValues - 1);')
          with open('src/base/bit-field.h', 'w') as f:
              f.write(bf)

          # 4. zutil.h: comment out ALL #define fdopen lines
          with open('third_party/zlib/zutil.h') as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              stripped = line.strip()
              if re.match(r'^#\s*define\s+fdopen\s*\(', stripped):
                  new_lines.append('// ' + line)
              else:
                  new_lines.append(line)
          with open('third_party/zlib/zutil.h', 'w') as f:
              f.writelines(new_lines)
          print("All patches applied successfully")
          PYEOF

      - name: Configure and Build
        run: |
          cd build/v8
          cat > args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          v8_static_library = true
          v8_use_external_startup_data = false
          v8_enable_sandbox = false
          v8_optimized_debug = false
          v8_enable_gdbjit = false
          v8_enable_backtrace = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_verify_heap = false
          treat_warnings_as_errors = false
          use_custom_libcxx = false
          target_cpu = "arm64"
          is_clang = true
          use_lld = false
          clang_use_chrome_plugins = false
          EOF
          
          gn gen out.gn/arm64.release
          ninja -C out.gn/arm64.release d8

      - name: Package
        run: |
          cd build/v8
          cp out.gn/arm64.release/d8 ./d8
          chmod +x d8
          tar czf d8-v8-10.2.154.26-mac-arm64.tar.gz d8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-mac-arm64
          path: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v8-10.2.154.26-debug-mac
          name: "V8 10.2.154.26 d8 (macOS arm64)"
          body: "Target: Qaxbrowser (Chromium 102 / V8 10.2.154.26)"
          files: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
