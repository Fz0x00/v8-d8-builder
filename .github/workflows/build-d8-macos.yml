name: Build d8 V8-10.2.154.26 (macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Install dependencies
        run: |
          brew install python3 git curl pkg-config
          # Force install setuptools to system Python
          python3 -m pip install --break-system-packages --user setuptools 2>/dev/null || \
          python3 -c "import setuptools; print('setuptools already available')" 2>/dev/null || \
          (curl -sS https://bootstrap.pypa.io/get-pip.py | python3 - --break-system-packages && \
           python3 -m pip install --break-system-packages setuptools)

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch V8
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout 10.2.154.26
          # Skip hooks first, then run them after patching
          gclient sync --nohooks
          # Now patch before running hooks
          sed -i '' 's/import pkg_resources/try:\n    import pkg_resources\nexcept ImportError:\n    pass/' build/mac_toolchain.py 2>/dev/null || true
          gclient runhooks

      - name: Patch source for Clang 21 compatibility
        run: |
          cd build/v8
          
          # Force C++17
          sed -i '' 's/cflags_cc += \[ "-std=${standard_prefix}++20" \]/cflags_cc += [ "-std=${standard_prefix}++17" ]/' build/config/compiler/BUILD.gn
          
          # Comment out failing static_asserts
          sed -i '' '/^static_assert(ArchOpcodeField/s/^/\/\//' src/compiler/backend/instruction-codes.h
          sed -i '' '/AddressingModeField::is_valid/s/^/\/\//' src/compiler/backend/instruction-codes.h
          sed -i '' '/"All addressing modes/s/^/\/\//' src/compiler/backend/instruction-codes.h
          
          # Fix zlib macOS redefinition
          sed -i '' '/#ifdef __APPLE__/,/#endif/{
            /#ifdef __APPLE__/!{
              /#  define OS_CODE 19/{
                i\
          #  ifndef OS_CODE
                a\
          #  endif
              }
            }
          }' third_party/zlib/zutil.h
          
          echo "Patches applied"

      - name: Configure and Build
        run: |
          cd build/v8
          cat > args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          v8_static_library = true
          v8_use_external_startup_data = false
          v8_enable_sandbox = false
          v8_optimized_debug = false
          v8_enable_gdbjit = false
          v8_enable_backtrace = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_verify_heap = false
          treat_warnings_as_errors = false
          use_custom_libcxx = false
          target_cpu = "arm64"
          is_clang = true
          use_lld = false
          EOF
          
          gn gen out.gn/arm64.release
          ninja -C out.gn/arm64.release d8

      - name: Package
        run: |
          cd build/v8
          cp out.gn/arm64.release/d8 ./d8
          chmod +x d8
          tar czf d8-v8-10.2.154.26-mac-arm64.tar.gz d8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-mac-arm64
          path: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v8-10.2.154.26-debug-mac
          name: "V8 10.2.154.26 d8 (macOS arm64)"
          body: "Target: Qaxbrowser (Chromium 102 / V8 10.2.154.26)"
          files: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
