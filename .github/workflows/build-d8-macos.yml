name: Build d8 V8-10.2.154.26 (macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Install dependencies
        run: |
          brew install python3 git curl pkg-config

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd depot_tools && ./ensure_bootstrap

      - name: Fetch V8
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout 10.2.154.26
          gclient sync --nohooks --no-history

      - name: Patch source
        run: |
          cd build/v8
          
          # 1. Remove Werror and clang plugins from BUILD.gn
          sed -i '' '/add-plugin/d' build/config/compiler/BUILD.gn
          sed -i '' '/plugin-arg-find-bad-constructs/d' build/config/compiler/BUILD.gn
          sed -i '' '/check-stack-allocated/d' build/config/compiler/BUILD.gn
          sed -i '' '/raw-ptr-template-as-trivial-member/d' build/config/compiler/BUILD.gn
          sed -i '' '/use-classify-type/d' build/config/compiler/BUILD.gn
          sed -i '' 's/"-Werror"/"-Wno-error"/g' build/config/compiler/BUILD.gn
          
          # 2. Comment out static_asserts in instruction-codes.h
          sed -i '' 's/^static_assert(ArchOpcodeField/\/\/static_assert(ArchOpcodeField/' src/compiler/backend/instruction-codes.h
          sed -i '' 's/^    AddressingModeField::is_valid/\/\/    AddressingModeField::is_valid/' src/compiler/backend/instruction-codes.h
          sed -i '' 's/^    "All addressing modes/\/\/    "All addressing modes/' src/compiler/backend/instruction-codes.h
          
          # 3. Fix zlib: comment out ALL fdopen macros and fix OS_CODE
          sed -i '' 's|^#  define fdopen(fd,mode) NULL /\* No fdopen() \*/|// patched: removed fdopen macro|' third_party/zlib/zutil.h
          sed -i '' 's|^#    define fdopen(fd,mode) NULL /\* No fdopen() \*/|// patched: removed fdopen macro|' third_party/zlib/zutil.h
          sed -i '' 's|^#    define fdopen(fd,type)  _fdopen(fd,type)|// patched: removed fdopen macro|' third_party/zlib/zutil.h
          # Fix OS_CODE redefinition
          sed -i '' 's|^#ifdef __APPLE__$|#ifdef __APPLE__\n#  ifndef OS_CODE|' third_party/zlib/zutil.h
          sed -i '' 's|^#  define OS_CODE 19$|#  define OS_CODE 19\n#  endif|' third_party/zlib/zutil.h
          
          # Verify
          echo "fdopen count after patch:"
          grep -c "define fdopen" third_party/zlib/zutil.h || echo "0"
          echo "Plugin count after patch:"
          grep -c "find-bad-constructs" build/config/compiler/BUILD.gn || echo "0"
          echo "Done"

      - name: Configure and Build
        run: |
          cd build/v8
          cat > args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          v8_static_library = true
          v8_use_external_startup_data = false
          v8_enable_sandbox = false
          v8_optimized_debug = false
          v8_enable_gdbjit = false
          v8_enable_backtrace = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_verify_heap = false
          treat_warnings_as_errors = false
          use_custom_libcxx = false
          target_cpu = "arm64"
          is_clang = true
          use_lld = false
          clang_use_chrome_plugins = false
          EOF
          
          gn gen out.gn/arm64.release
          ninja -C out.gn/arm64.release d8

      - name: Package
        run: |
          cd build/v8
          cp out.gn/arm64.release/d8 ./d8
          chmod +x d8
          tar czf d8-v8-10.2.154.26-mac-arm64.tar.gz d8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-mac-arm64
          path: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v8-10.2.154.26-debug-mac
          name: "V8 10.2.154.26 d8 (macOS arm64)"
          body: "Target: Qaxbrowser (Chromium 102 / V8 10.2.154.26)"
          files: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
