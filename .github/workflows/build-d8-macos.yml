name: Build d8 V8-10.2.154.26 (macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Install dependencies
        run: |
          brew install python3 git curl pkg-config

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd depot_tools && ./ensure_bootstrap

      - name: Fetch V8
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout 10.2.154.26
          gclient sync --nohooks --no-history

      - name: Patch source
        run: |
          cd build/v8
          
          # 1. Remove ALL -Werror flags from BUILD.gn
          sed -i '' 's/"-Werror"/"-Wno-error"/g' build/config/compiler/BUILD.gn
          
          # 2. Remove clang plugin lines entirely (different patterns)
          sed -i '' '/add-plugin/d' build/config/compiler/BUILD.gn
          sed -i '' '/plugin-arg-find-bad-constructs/d' build/config/compiler/BUILD.gn
          sed -i '' '/check-stack-allocated/d' build/config/compiler/BUILD.gn
          sed -i '' '/raw-ptr-template-as-trivial-member/d' build/config/compiler/BUILD.gn
          sed -i '' '/use-classify-type/d' build/config/compiler/BUILD.gn
          
          # 3. Comment out failing static_asserts
          sed -i '' '/^static_assert(ArchOpcodeField/s/^\/\//' src/compiler/backend/instruction-codes.h
          sed -i '' '/AddressingModeField::is_valid/kLastAddressingMode/s/^\/\//' src/compiler/backend/instruction-codes.h
          sed -i '' '/"All addressing modes must fit/s/^\/\//' src/compiler/backend/instruction-codes.h
          
          # 4. Fix zlib: replace the entire __APPLE__ block to avoid fdopen/stdio conflict
          # The issue is fdopen macro from zutil.h conflicts with macOS SDK
          python3 -c "
          import re
          with open('third_party/zlib/zutil.h', 'r') as f:
              content = f.read()
          # Comment out the fdopen macro
          content = content.replace('#define fdopen(fd,mode) NULL /* No fdopen() */', '// #define fdopen(fd,mode) NULL /* patched */')
          # Add include guard around __APPLE__ OS_CODE
          content = content.replace('#ifdef __APPLE__\\n#  define OS_CODE 19', '#ifdef __APPLE__\\n#  ifndef OS_CODE\\n#    define OS_CODE 19\\n#  endif')
          with open('third_party/zlib/zutil.h', 'w') as f:
              f.write(content)
          "
          
          # 5. Verify patches
          echo "=== Verify clang plugin removed ==="
          grep -c "find-bad-constructs" build/config/compiler/BUILD.gn || echo "0 matches (good)"
          echo "=== Verify Werror removed ==="
          grep -c '"-Werror"' build/config/compiler/BUILD.gn || echo "0 matches (good)"
          
          echo "Patches applied"

      - name: Configure and Build
        run: |
          cd build/v8
          cat > args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          v8_static_library = true
          v8_use_external_startup_data = false
          v8_enable_sandbox = false
          v8_optimized_debug = false
          v8_enable_gdbjit = false
          v8_enable_backtrace = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_verify_heap = false
          treat_warnings_as_errors = false
          use_custom_libcxx = false
          target_cpu = "arm64"
          is_clang = true
          use_lld = false
          clang_use_chrome_plugins = false
          EOF
          
          gn gen out.gn/arm64.release
          ninja -C out.gn/arm64.release d8

      - name: Package
        run: |
          cd build/v8
          cp out.gn/arm64.release/d8 ./d8
          chmod +x d8
          tar czf d8-v8-10.2.154.26-mac-arm64.tar.gz d8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-mac-arm64
          path: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v8-10.2.154.26-debug-mac
          name: "V8 10.2.154.26 d8 (macOS arm64)"
          body: "Target: Qaxbrowser (Chromium 102 / V8 10.2.154.26)"
          files: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
