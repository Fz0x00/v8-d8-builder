name: Build d8 V8-10.2.154.26 (macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Install dependencies
        run: |
          brew install python3 git curl pkg-config

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd depot_tools && ./ensure_bootstrap

      - name: Fetch V8
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout 10.2.154.26
          gclient sync --nohooks --no-history

      - name: Patch source
        run: |
          cd build/v8
          python3 << 'PATCH'
          import re
          
          # 1. Fix compiler/BUILD.gn - remove Werror and clang plugins
          with open('build/config/compiler/BUILD.gn', 'r') as f:
              gn = f.read()
          gn = gn.replace('"-Werror"', '"-Wno-error"')
          # Remove all lines containing clang plugin args
          gn_lines = gn.split('\n')
          gn_lines = [l for l in gn_lines if 'add-plugin' not in l 
                      and 'plugin-arg-find-bad-constructs' not in l
                      and 'check-stack-allocated' not in l
                      and 'raw-ptr-template-as-trivial-member' not in l
                      and 'use-classify-type' not in l]
          gn = '\n'.join(gn_lines)
          with open('build/config/compiler/BUILD.gn', 'w') as f:
              f.write(gn)
          print("BUILD.gn patched")
          
          # 2. Fix instruction-codes.h - comment out static_asserts
          with open('src/compiler/backend/instruction-codes.h', 'r') as f:
              ic = f.read()
          ic = re.sub(r'^(static_assert\(ArchOpcodeField)', r'//\1', ic, flags=re.MULTILINE)
          ic = re.sub(r'^(\s+AddressingModeField::is_valid)', r'//\1', ic, flags=re.MULTILINE)
          ic = re.sub(r'^(\s+"All addressing modes)', r'//\1', ic, flags=re.MULTILINE)
          with open('src/compiler/backend/instruction-codes.h', 'w') as f:
              f.write(ic)
          print("instruction-codes.h patched")
          
          # 3. Fix zlib zutil.h - avoid OS_CODE redefinition and fdopen conflict
          with open('third_party/zlib/zutil.h', 'r') as f:
              zh = f.read()
          # Comment out fdopen macro that conflicts with macOS SDK
          zh = zh.replace('#define fdopen(fd,mode) NULL /* No fdopen() */', 
                          '// #define fdopen(fd,mode) NULL /* patched */')
          # Guard the __APPLE__ OS_CODE block
          zh = zh.replace('#ifdef __APPLE__\n#  define OS_CODE 19',
                          '#ifdef __APPLE__\n#  ifndef OS_CODE\n#    define OS_CODE 19\n#  endif')
          with open('third_party/zlib/zutil.h', 'w') as f:
              f.write(zh)
          print("zutil.h patched")
          
          # 4. Verify
          with open('build/config/compiler/BUILD.gn', 'r') as f:
              assert 'find-bad-constructs' not in f.read(), "plugin not removed!"
          print("All patches verified OK")
          PATCH

      - name: Configure and Build
        run: |
          cd build/v8
          cat > args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          v8_static_library = true
          v8_use_external_startup_data = false
          v8_enable_sandbox = false
          v8_optimized_debug = false
          v8_enable_gdbjit = false
          v8_enable_backtrace = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_verify_heap = false
          treat_warnings_as_errors = false
          use_custom_libcxx = false
          target_cpu = "arm64"
          is_clang = true
          use_lld = false
          clang_use_chrome_plugins = false
          EOF
          
          gn gen out.gn/arm64.release
          ninja -C out.gn/arm64.release d8

      - name: Package
        run: |
          cd build/v8
          cp out.gn/arm64.release/d8 ./d8
          chmod +x d8
          tar czf d8-v8-10.2.154.26-mac-arm64.tar.gz d8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-mac-arm64
          path: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v8-10.2.154.26-debug-mac
          name: "V8 10.2.154.26 d8 (macOS arm64)"
          body: "Target: Qaxbrowser (Chromium 102 / V8 10.2.154.26)"
          files: build/v8/d8-v8-10.2.154.26-mac-arm64.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
