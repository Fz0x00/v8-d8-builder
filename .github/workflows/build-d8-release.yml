name: Build d8 (Release) - CVE Testing

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'V8 version tag (e.g., 10.2.154.26)'
        required: false
        default: '10.2.154.26'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 pkg-config git curl wget
      
      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH
      
      - name: Fetch V8
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout "${{ github.event.inputs.v8_version || '10.2.154.26' }}"
          echo "V8 commit: $(git log -1 --format='%H %s')"
      
      - name: Sync dependencies
        run: |
          cd build/v8
          gclient sync -D --with_branch_heads -R
          echo "gclient sync completed"
      
      - name: Patch DCHECK_ALWAYS_ON
        run: |
          cd build/v8
          # Remove DCHECK_ALWAYS_ON from Chromium build config
          if [ -f build/config/BUILD.gn ]; then
            sed -i 's/defines += \[ "DCHECK_ALWAYS_ON=1" \]/# DISABLED: DCHECK_ALWAYS_ON for release build/' build/config/BUILD.gn
            echo "DCHECK_ALWAYS_ON patched"
          fi
          grep -n "DCHECK_ALWAYS_ON" build/config/BUILD.gn || echo "Confirmed: DCHECK_ALWAYS_ON removed"
      
      - name: Configure and Build
        run: |
          cd build/v8
          
          cat > args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          v8_static_library = true
          v8_use_external_startup_data = false
          use_custom_libcxx = false
          v8_enable_i18n_support = false
          target_cpu = "x64"
          treat_warnings_as_errors = false
          is_clang = true
          use_lld = true
          clang_use_chrome_plugins = false
          v8_enable_sandbox = false
          v8_enable_debugging_features = false
          v8_enable_slow_dchecks = false
          v8_enable_backtrace = true
          v8_enable_disassembler = true
          EOF
          
          gn gen out.gn/x64.release
          ninja -C out.gn/x64.release d8
          
          echo "Build completed!"
          ls -lh out.gn/x64.release/d8
      
      - name: Test d8
        run: |
          cd build/v8
          echo "print('Release d8 works! V8 version:')" > /tmp/test.js
          out.gn/x64.release/d8 /tmp/test.js || true
          out.gn/x64.release/d8 --version 2>&1 || true
      
      - name: Package
        run: |
          cd build/v8
          mkdir -p d8-dist
          cp out.gn/x64.release/d8 d8-dist/
          cp out.gn/x64.release/libv8.so d8-dist/ 2>/dev/null || true
          cp out.gn/x64.release/libv8_libbase.so d8-dist/ 2>/dev/null || true
          cp out.gn/x64.release/libv8_libplatform.so d8-dist/ 2>/dev/null || true
          cp out.gn/x64.release/snapshot_blob.bin d8-dist/ 2>/dev/null || true
          tar czf $GITHUB_WORKSPACE/d8-release-linux-x64.tar.gz -C d8-dist .
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v8-${{ github.event.inputs.v8_version || '10.2.154.26' }}-release"
          name: "V8 ${{ github.event.inputs.v8_version || '10.2.154.26' }} d8 (release, no DCHECK)"
          body: |
            ## V8 d8 Release Build (DCHECK disabled)
            
            **V8 Version:** ${{ github.event.inputs.v8_version || '10.2.154.26' }}
            
            ### Key Changes
            - `is_debug = false` 
            - `DCHECK_ALWAYS_ON` removed from build config
            - `v8_enable_debugging_features = false`
            
            This allows CVE exploits to run without hitting debug assertion checks.
          files: |
            d8-release-linux-x64.tar.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
