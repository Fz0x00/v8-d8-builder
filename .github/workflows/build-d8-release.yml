name: Build d8 (Release) - CVE Testing

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'V8 version tag (e.g., 10.2.154.26, 12.3.219.9)'
        required: false
        default: '10.2.154.26'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 pkg-config git curl wget

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch V8
        run: |
          mkdir -p build && cd build
          fetch v8
          cd v8
          git checkout "${{ github.event.inputs.v8_version || '10.2.154.26' }}"
          echo "V8 commit: $(git log -1 --format='%H %s')"

      - name: Sync dependencies
        run: |
          cd build/v8
          gclient sync -D --with_branch_heads -R
          echo "gclient sync completed"


      - name: Configure and Build
        run: |
          cd build/v8

          # NOTE on DCHECKs: DEBUG (and thus DCHECK) is defined when EITHER
          #   v8_enable_debugging_features = true   (V8 BUILD.gn)
          #   OR dcheck_always_on = true            (else-if branch, same file)
          # Full %DebugPrint output only needs v8_enable_object_print.
          # Args are passed via --args on the command line: on V8 12.x a
          # source-root args.gn proved unreliable (12.3 gate caught
          # v8_enable_debugging_features resolving true despite args.gn).
          GN_ARGS='is_debug=false is_component_build=false v8_static_library=true v8_use_external_startup_data=false use_custom_libcxx=true v8_enable_i18n_support=false target_cpu="x64" treat_warnings_as_errors=false is_clang=true use_lld=true clang_use_chrome_plugins=false v8_enable_sandbox=false v8_enable_debugging_features=false v8_enable_object_print=true v8_enable_disassembler=true v8_enable_test_features=true v8_enable_verify_heap=false v8_enable_debug_code=false v8_enable_v8_checks=false cppgc_enable_verify_heap=false v8_enable_slow_dchecks=false dcheck_always_on=false'

          gn gen out.gn/x64.release --args="$GN_ARGS"
          echo "=== resolved args (out dir args.gn as written by gn) ==="
          cat out.gn/x64.release/args.gn
          ninja -C out.gn/x64.release d8 -j2

          echo "Build completed!"
          ls -lh out.gn/x64.release/d8

      - name: Verify build config (no DCHECK, natives + object print on)
        run: |
          cd build/v8
          for arg in v8_enable_debugging_features dcheck_always_on v8_enable_object_print v8_enable_debug_code v8_enable_verify_heap; do
            echo -n "$arg = "
            gn args out.gn/x64.release --list=$arg --short | head -1
          done
          # Hard gate: abort packaging if DCHECK-enabling flags are on
          if gn args out.gn/x64.release --list=v8_enable_debugging_features --short | grep -q "true"; then
            echo "::error::v8_enable_debugging_features is ON - DCHECKs would be compiled in"
            exit 1
          fi
          if gn args out.gn/x64.release --list=dcheck_always_on --short | grep -q "true"; then
            echo "::error::dcheck_always_on is ON - DCHECKs would be compiled in"
            exit 1
          fi
          if gn args out.gn/x64.release --list=v8_enable_object_print --short | grep -q "false"; then
            echo "::error::v8_enable_object_print is OFF - %DebugPrint output would be useless"
            exit 1
          fi

      - name: Test d8
        run: |
          cd build/v8
          cat > /tmp/test.js << 'EOF'
          var o = {a: 1, b: 2};
          %DebugPrint(o);
          print("natives + object print OK");
          function f(x) { return x + 1; }
          %PrepareFunctionForOptimization(f);
          f(1); f(2);
          %OptimizeFunctionOnNextCall(f);
          f(3);
          print("TurboFan optimization OK, status: " + %GetOptimizationStatus(f));
          EOF
          out.gn/x64.release/d8 --allow-natives-syntax /tmp/test.js

      - name: Package
        run: |
          cd build/v8
          mkdir -p d8-dist
          cp out.gn/x64.release/d8 d8-dist/
          for f in out.gn/x64.release/*.so out.gn/x64.release/*.so.* out.gn/x64.release/snapshot_blob.bin; do
            [ -e "$f" ] && cp "$f" d8-dist/ || true
          done
          echo "=== d8-dist ==="
          ls -la d8-dist/
          echo "=== ldd ==="
          LD_LIBRARY_PATH=$(pwd)/d8-dist ldd out.gn/x64.release/d8 2>/dev/null || true
          tar czf $GITHUB_WORKSPACE/d8-release-linux-x64.tar.gz -C d8-dist .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v8-${{ github.event.inputs.v8_version || '10.2.154.26' }}-release"
          name: "V8 ${{ github.event.inputs.v8_version || '10.2.154.26' }} d8 (release, no DCHECK)"
          body: |
            ## V8 d8 Release Build (no DCHECK, natives + object print enabled)

            **V8 Version:** ${{ github.event.inputs.v8_version || '10.2.154.26' }}

            ### Key Build Flags
            - `is_debug = false`, `dcheck_always_on = false`, no `dcheck_is_configurable`
            - `v8_enable_debugging_features = false` → no `DEBUG` define → DCHECKs compiled out
            - `v8_enable_object_print = true` → full `%DebugPrint` output
            - `v8_enable_test_features = true` → `--allow-natives-syntax` natives available
            - `v8_enable_sandbox = false`
          files: |
            d8-release-linux-x64.tar.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
